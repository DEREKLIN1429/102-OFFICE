<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>102 部門應用程式網站 V2.1 (102 Departmental Application Index v2.1)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        /* 1. 基本設定 */
        body {
            background-color: #A9A9A9; 
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Arial, sans-serif;
            padding: 20px 5px;
            margin: 0;
            min-height: 100vh;
        }

        .header-container {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
            max-width: 720px; 
            position: relative; /* 確保內部元素排版相對穩定 */
            padding-top: 40px; /* 留出空間給右上角的按鈕，避免標題被擋住 */
        }

        h1 { color: #333; margin: 0; font-size: 24px; text-shadow: 1px 1px 2px rgba(255,255,255,0.3); }
        .subheader { color: #444; font-size: 14px; margin-top: 5px; font-weight: bold; }

        /* 2. 分組容器與標題 */
        .group-container {
            width: 100%;
            max-width: 720px; 
            margin-bottom: 20px;
        }

        .group-title {
            color: #222;
            font-size: 18px;
            font-weight: bold;
            margin: 15px 5px 10px 5px;
            padding-left: 10px;
            border-left: 5px solid #555;
            background-color: rgba(255,255,255,0.1);
            padding: 5px 10px;
            border-radius: 0 4px 4px 0;
        }

        .button-grid {
            display: flex;
            flex-wrap: wrap; 
            gap: 10px; 
            justify-content: flex-start; 
            padding: 0 5px;
        }

        /* 3. 按鈕樣式 (依顏色分組) */
        .btn-style {
            width: calc((100% - 20px) / 3); 
            height: 120px; 
            text-decoration: none; 
            color: #fff; 
            border-radius: 12px; 
            cursor: pointer;
            position: relative; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 4px;
            box-sizing: border-box;
            transition: transform 0.1s;
        }

        .btn-style:active { transform: translateY(3px); }

        .btn-icon { font-size: 28px; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-text { 
            font-size: 13px; 
            font-weight: 800; 
            line-height: 1.2; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4); 
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .lock-indicator {
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 12px;
            color: rgba(255,255,255,0.8);
        }

        .color-group-0 { background: linear-gradient(to bottom, #FF8C00, #FF7F00); box-shadow: 0 3px 0 #D46900; }
        .color-group-1 { background: linear-gradient(to bottom, #2196F3, #1976D2); box-shadow: 0 3px 0 #0D47A1; }
        .color-group-2 { background: linear-gradient(to bottom, #4CAF50, #388E3C); box-shadow: 0 3px 0 #1B5E20; }
        .color-group-3 { background: linear-gradient(to bottom, #9C27B0, #7B1FA2); box-shadow: 0 3px 0 #4A148C; }
        .color-group-4 { background: linear-gradient(to bottom, #F44336, #D32F2F); box-shadow: 0 3px 0 #B71C1C; }
        .color-group-5 { background: linear-gradient(to bottom, #00BCD4, #0097A7); box-shadow: 0 3px 0 #006064; }

        @media (min-width: 769px) {
            .header-container { padding-top: 0; margin-top: 40px; } /* 電腦版空間微調 */
            .header-container, .group-container { max-width: 1200px; }
            .btn-style { width: calc((100% - 40px) / 5); height: 180px; }
            .btn-icon { font-size: 60px; margin-bottom: 15px; }
            .btn-text { font-size: 18px; }
            .lock-indicator { top: 10px; right: 10px; font-size: 16px; }
        }

        /* 4. 後台管理與懸浮按鈕 Modal */
        #settings-btn {
            position: fixed; bottom: 20px; right: 20px;
            width: 50px; height: 50px; border-radius: 50%;
            background-color: #333; color: white; border: 2px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); z-index: 100;
            font-size: 24px; cursor: pointer; transition: transform 0.2s;
        }
        #settings-btn:hover { transform: scale(1.1); }

        /* 清除資料按鈕樣式 (改為右上角) */
        #clear-data-btn {
            position: absolute; /* 絕對定位在頁面最上方 */
            top: 15px; 
            right: 15px; /* 右上角 */
            height: 40px; /* 稍微縮小一點讓頂部比例更好看 */
            border-radius: 20px; /* 膠囊形狀 */
            background-color: #f44336; /* 紅色警告色 */
            color: white; 
            border: 2px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); 
            z-index: 100;
            font-size: 13px; 
            font-weight: bold;
            cursor: pointer; 
            padding: 0 15px;
            display: flex;
            align-items: center;
            gap: 6px; 
            transition: transform 0.2s;
        }
        #clear-data-btn:hover { transform: scale(1.05); }

        .modal {
            display: none; position: fixed; z-index: 101;
            left: 0; top: 0; width: 100%; height: 100%;
            overflow-y: auto; background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background-color: #fefefe; margin: 0; width: 100%;
            min-height: 100vh; padding: 20px; box-sizing: border-box;
        }

        .setting-group-header {
            padding: 10px; font-weight: bold; margin-top: 20px; 
            border-radius: 4px; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .header-style-0 { background-color: #FF8C00; } 
        .header-style-1 { background-color: #2196F3; } 
        .header-style-2 { background-color: #4CAF50; } 
        .header-style-3 { background-color: #9C27B0; } 
        .header-style-4 { background-color: #F44336; } 
        .header-style-5 { background-color: #00BCD4; }

        .setting-item {
            border: 1px solid #ddd; padding: 10px;
            margin-bottom: 10px; border-radius: 5px;
            background-color: #fff; display: flex; flex-direction: column; gap: 8px;
        }

        .setting-item input[type="text"] {
            padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; box-sizing: border-box;
        }

        .item-actions { display: flex; gap: 10px; margin-top: 5px; }
        .action-btn {
            flex: 1; padding: 10px; border: none; border-radius: 4px;
            color: white; cursor: pointer; font-size: 14px;
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .save-btn { background-color: #2196F3; } 
        .delete-btn { background-color: #f44336; } 

        .modal-footer { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 30px;}
        #close-modal-btn { background-color: #666; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; font-size: 16px; cursor: pointer;}
        #reset-btn { background-color: #999; color: white; padding: 12px; border: none; border-radius: 4px; width: 100%; cursor: pointer;}

        .add-form { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; }
        .add-form select { width: 100%; padding: 8px; margin-bottom: 10px; }
        .add-btn { width: 100%; background-color: #4CAF50; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;}
    </style>
</head>
<body>

    <button id="clear-data-btn" onclick="clearLocalData()">
        <i class="fas fa-trash-restore"></i> 清除快取
    </button>

    <div class="header-container">
        <h1>🏢 102 部門應用程式索引 V2.1</h1>
        <div class="subheader">102 Departmental Application Index v2.1</div>
    </div>

    <div id="main-container"></div>
    
    <button id="settings-btn" onclick="checkAdminAndOpen()">
        <i class="fas fa-cog"></i>
    </button>
    
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h2>⚙️ 管理應用程式 (後台)</h2>
            <p style="font-size:12px; color:#666;">您已登入管理員模式</p>
            
            <div class="add-form">
                <h3>新增項目</h3>
                <label>選擇群組</label>
                <select id="new-group-select">
                    <option value="0">第一組 (機械故障訊息)</option>
                    <option value="1">第二組 (庫存盤點)</option>
                    <option value="2">第三組 (5S查核)</option>
                    <option value="3">第四組 (保養查核)</option>
                    <option value="4">第五組 (維修紀錄)</option>
                    <option value="5">第六組 (圖表分析)</option>
                </select>
                <input type="text" id="new-en" placeholder="英文名稱 (必填)">
                <input type="text" id="new-cn" placeholder="中文名稱 (選填)">
                <input type="text" id="new-url" placeholder="網址 (https://...)">
                <input type="text" id="new-pwd" placeholder="個別連結密碼 (選填)" style="border: 1px solid #ffa500;">
                <button class="add-btn" onclick="addNewButton()">
                    <i class="fas fa-plus"></i> 新增至列表
                </button>
            </div>

            <hr>
            <h3>編輯現有項目</h3>
            <div id="settings-list"></div>
            
            <div class="modal-footer">
                <button id="close-modal-btn" onclick="closeModal()">完成並關閉</button>
                <button id="reset-btn" onclick="resetToDefault()">重置所有設定為預設值</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "88888888"; 
        const STORAGE_KEY = 'departmentalAppButtonsV15_Admin'; 

        const defaultData = [
            {
                title: "機械故障訊息 (Machine NG INFO)",
                items: [
                    { en: "Machine NG MX", cn: "混練故障訊息", url: "https://dereklin1429.github.io/Machine-NG-MX/", icon: "fa-exclamation-triangle" },
                    { en: "Machine NG CL", cn: "上膠故障訊息", url: "https://dereklin1429.github.io/Machine-NG-CL/", icon: "fa-exclamation-triangle" },
                    { en: "Machine NG EX", cn: "押出故障訊息", url: "https://dereklin1429.github.io/Machine-NG-EX/", icon: "fa-exclamation-triangle" },
                    { en: "Machine NG CT", cn: "裁斷故障訊息", url: "https://dereklin1429.github.io/Machine-NG-CT/", icon: "fa-exclamation-triangle" }
                ]
            },
            {
                title: "庫存盤點 (Inventory)",
                items: [
                    { en: "Mixing Inventory", cn: "混練盤點", url: "https://dereklin1429.github.io/derekmxInventory02/", icon: "fa-cubes" },
                    { en: "Extrusion Inventory", cn: "押出盤點", url: "https://dereklin1429.github.io/derekexInventory02/", icon: "fa-layer-group" },
                    { en: "Calendering Inventory", cn: "上膠盤點", url: "https://dereklin1429.github.io/derekclInventory02/", icon: "fa-scroll" },
                    { en: "CUTTING Inventory", cn: "裁斷盤點", url: "https://dereklin1429.github.io/derekctInventory02/", icon: "fa-cut" },
                    { en: "RW WH Inventory", cn: "原物料倉庫", url: "https://dereklin1429.github.io/derekrmwnInventory01/", icon: "fa-warehouse" }
                ]
            },
            {
                title: "5S查核 (5S-audit)",
                items: [
                    { en: "5S audit MX", cn: "混練5S稽核", url: "https://dereklin1429.github.io/5S-audit_MX/", icon: "fa-tasks" },
                    { en: "5S audit CL", cn: "上膠5S稽核", url: "https://dereklin1429.github.io/5S-audit_CL/", icon: "fa-tasks" },
                    { en: "5S audit EX", cn: "押出5S稽核", url: "https://dereklin1429.github.io/5S-audit-EX/", icon: "fa-tasks" },
                    { en: "5S audit CT", cn: "裁斷5S稽核", url: "https://dereklin1429.github.io/5S-audit-CT/", icon: "fa-tasks" },
                    { en: "5S audit WH", cn: "倉庫5S稽核", url: "https://dereklin1429.github.io/5S-audit-WH/", icon: "fa-tasks" }
                ]
            },
            {
                title: "保養查核 (Maintenance)",
                items: [
                    { en: "MX Maintenance", cn: "混練保養查核", url: "https://dereklin1429.github.io/M-C-maintenance-MX/", icon: "fa-cogs" },
                    { en: "CT Maintenance", cn: "裁斷保養查核", url: "https://dereklin1429.github.io/Maintenance-CT/", icon: "fa-file-alt" },
                    { en: "EX Maintenance", cn: "押出保養查核", url: "https://dereklin1429.github.io/M-C_Maintenance-EX/", icon: "fa-clipboard-check" },
                    { en: "CL Maintenance", cn: "上膠保養查核", url: "https://dereklin1429.github.io/MC-Maintenance-CL/", icon: "fa-list-ol" },
                    { en: "Container MM Info", cn: "貨櫃管理資訊", url: "https://dereklin1429.github.io/Vehicle-Management/", icon: "fa-truck" },
                    { en: "RM Management", cn: "原管庫存管理", url: "https://dereklin1429.github.io/Warehouse-Inventory-System-V6.0/", icon: "fa-warehouse" }
              ]
            },
            {
                title: "一二三級保養紀錄 (Level 123 History)",
                items: [
                    { en: "MX 123 History", cn: "混練一二三級保養", url: "https://dereklin1429.github.io/Repair-History-MX/", icon: "fa-tools" }
                ]
            },
            {
                title: "圖表分析 (Chart Analysis)",
                items: [
                    { en: "Mixing schedule", cn: "混練生產排程系統", url: "https://dereklin1429.github.io/MAXXIS-Production-Dashboard-V2.0/", icon: "fa-calendar-alt" },
                    { en: "Car Live Status", cn: "車輛動態管理", url: "https://dereklin1429.github.io/Intelligent-Container-Logistics-Dashboard-v6/", icon: "fa-chart-line" },
                    { en: "Procurement List", cn: "採購清單彙整", url: "https://dereklin1429.github.io/Procurement-List-03/", icon: "fa-file-invoice-dollar" },
                    { en: "AOT Schedule", cn: "AOT 計畫表", url: "https://dereklin1429.github.io/project-mon-aot-v.02/", icon: "fa-project-diagram" },
                    { en: "PONE QR Code", cn: "QRCode 生成", url: "https://dereklin1429.github.io/derekqrcoed01/", icon: "fa-qrcode" },
                    { en: "WET TEST", cn: "設備試車檢查", url: "https://dereklin1429.github.io/MCWETTEST01/", icon: "fa-truck" },
                    { en: "SCRAP DATA", cn: "材料報廢紀錄", url: "https://dereklin1429.github.io/Monthly-Scrap-Data-Statistics-V2.0/", icon: "fa-book" } 
                ]
            }
        ];

        let appData = [];

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                appData = JSON.parse(saved);
            } else {
                appData = JSON.parse(JSON.stringify(defaultData));
                saveData();
            }
            renderMain();
        }

        function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

        function renderMain() {
            const container = document.getElementById('main-container');
            container.innerHTML = '';
            appData.forEach((group, groupIndex) => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-container';
                groupDiv.innerHTML = `<div class="group-title">${group.title}</div>`;
                const grid = document.createElement('div');
                grid.className = 'button-grid';

                group.items.forEach(btn => {
                    let name = btn.en + (btn.cn ? `<br>(${btn.cn})` : '');
                    const link = document.createElement('a');
                    link.className = `btn-style color-group-${groupIndex}`;
                    link.href = btn.url;
                    
                    if (btn.password) {
                        link.innerHTML = `<i class="fas fa-lock lock-indicator"></i>`;
                        link.onclick = (e) => {
                            e.preventDefault();
                            if (prompt("🔒 請輸入密碼：") === btn.password) window.open(btn.url, '_blank');
                            else alert("❌ 密碼錯誤！");
                        };
                    } else {
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                    }
                    link.innerHTML += `<i class="fas ${btn.icon || 'fa-link'} btn-icon"></i><span class="btn-text">${name}</span>`;
                    grid.appendChild(link);
                });
                groupDiv.appendChild(grid);
                container.appendChild(groupDiv);
            });
        }

        function renderSettingsList() {
            const list = document.getElementById('settings-list');
            list.innerHTML = '';
            appData.forEach((group, gIdx) => {
                const header = document.createElement('div');
                header.className = `setting-group-header header-style-${gIdx}`;
                header.textContent = group.title;
                list.appendChild(header);
                group.items.forEach((item, iIdx) => {
                    const div = document.createElement('div');
                    div.className = 'setting-item';
                    div.innerHTML = `
                        <input type="text" value="${item.en}" id="en-${gIdx}-${iIdx}" placeholder="英文名稱">
                        <input type="text" value="${item.cn || ''}" id="cn-${gIdx}-${iIdx}" placeholder="中文名稱">
                        <input type="text" value="${item.url}" id="url-${gIdx}-${iIdx}" placeholder="網址">
                        <input type="text" value="${item.password || ''}" id="pwd-${gIdx}-${iIdx}" placeholder="密碼 (選填)">
                        <div class="item-actions">
                            <button class="action-btn save-btn" onclick="saveItem(${gIdx}, ${iIdx})">儲存</button>
                            <button class="action-btn delete-btn" onclick="deleteItem(${gIdx}, ${iIdx})">刪除</button>
                        </div>`;
                    list.appendChild(div);
                });
            });
        }

        function saveItem(g, i) {
            appData[g].items[i].en = document.getElementById(`en-${g}-${i}`).value;
            appData[g].items[i].cn = document.getElementById(`cn-${g}-${i}`).value;
            appData[g].items[i].url = document.getElementById(`url-${g}-${i}`).value;
            appData[g].items[i].password = document.getElementById(`pwd-${g}-${i}`).value;
            saveData(); renderMain(); alert("已儲存！");
        }

        function deleteItem(g, i) {
            if(confirm("確定刪除？")) { appData[g].items.splice(i, 1); saveData(); renderMain(); renderSettingsList(); }
        }

        function addNewButton() {
            const g = document.getElementById('new-group-select').value;
            const en = document.getElementById('new-en').value;
            const url = document.getElementById('new-url').value;
            if(!en || !url) return alert("英文名稱與網址為必填項目");
            appData[g].items.push({ 
                en: en, 
                cn: document.getElementById('new-cn').value, 
                url: url, 
                icon: "fa-link", 
                password: document.getElementById('new-pwd').value 
            });
            saveData(); renderMain(); renderSettingsList();
            
            document.getElementById('new-en').value = '';
            document.getElementById('new-cn').value = '';
            document.getElementById('new-url').value = '';
            document.getElementById('new-pwd').value = '';
            alert("新增成功");
        }

        function resetToDefault() {
            if (confirm("確定恢復預設值？這將會覆蓋你所有的自定義修改。")) { 
                appData = JSON.parse(JSON.stringify(defaultData)); 
                saveData(); 
                location.reload(); 
            }
        }

        function checkAdminAndOpen() {
            if (prompt("🔐 管理員密碼：") === ADMIN_PASSWORD) { 
                renderSettingsList(); 
                document.getElementById('settingsModal').style.display = "block"; 
            }
            else alert("密碼錯誤");
        }

        function closeModal() { document.getElementById('settingsModal').style.display = "none"; }
        window.onclick = (e) => { if(e.target == document.getElementById('settingsModal')) closeModal(); }

        // 清除 LocalStorage 資料並刷新網頁的功能
        function clearLocalData() {
            const confirmClear = confirm("⚠️ 確定要清除手機上儲存的網站資料嗎？\n\n這將會刪除您自定義的設定，並重新載入最新的網頁程式。");
            
            if (confirmClear) {
                localStorage.removeItem(STORAGE_KEY); 
                alert("✅ 資料已清除！網頁即將重新載入...");
                location.reload(); 
            }
        }

        loadData();
    </script>
</body>
</html>
